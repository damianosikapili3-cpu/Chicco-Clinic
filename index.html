function mkDb(){const SB=supabase.createClient(SB_URL,SB_KEY),cols={};
 const col=p=>p.split("/")[0],sn=(m,ch)=>({docs:[...m].map(([id,d])=>({id,exists:true,data:()=>d})),docChanges:()=>ch.map(x=>({type:x.type,doc:{id:x.id,data:()=>x.d}}))});
 function watch(c,cb){if(cols[c])return cols[c].subs.push(cb);const o=cols[c]={m:new Map,subs:[cb]};
  const emit=ch=>o.subs.forEach(f=>f(sn(o.m,ch)));
  SB.from("docs").select("path,data").eq("col",c).then(r=>{(r.data||[]).forEach(x=>o.m.set(x.path.split("/")[1],x.data));emit([])});
  SB.channel("w-"+c).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+c},e=>{const r=e.new&&e.new.path?e.new:e.old;if(!r||!r.path)return;const i=r.path.split("/")[1];if(e.eventType==="DELETE"){o.m.delete(i);emit([{type:"removed",id:i}])}else{const had=o.m.has(i);o.m.set(i,e.new.data);emit([{type:had?"modified":"added",id:i,d:e.new.data}])}}).subscribe()}
 const ref=p=>({id:p.split("/")[1],path:p,
  async set(d){const r=await SB.from("docs").upsert({path:p,col:col(p),data:d});if(r.error)throw r.error},
  async update(d){const r=await SB.from("docs").select("data").eq("path",p).maybeSingle();await SB.from("docs").upsert({path:p,col:col(p),data:{...(r.data?r.data.data:{}),...d}})},
  async delete(){await SB.from("docs").delete().eq("path",p)},
  onSnapshot(n){watch(col(p),s=>{const x=s.docs.find(d=>d.id===p.split("/")[1]);n({exists:!!x,data:()=>x&&x.data()})})}});
 return{doc:ref,collection:c=>({onSnapshot:n=>watch(c,n)})}}
(async()=>{try{S.me=localStorage.getItem("chc_me")||null}catch(e){}
 if(!window.supabase||SB_URL.startsWith("PASTE")){$("app").innerHTML='<div class="w card">Weka SB_URL na SB_KEY ya Supabase kwenye faili hili.</div>';return}db=mkDb();

 setTimeout(()=>{if(!S.ready){S.ready=1;render()}},10000);
 ["users","treats","appts","notifs"].forEach(c=>db.collection(c).onSnapshot(s=>{if(c==="notifs"&&seen)s.docChanges().forEach(x=>{if(x.type==="added"){const n=x.doc.data(),u=meU();if(u&&(n.to===u.id||n.to===u.role)&&Date.now()-n.ts<6e4)toast(n.text)}});S[c]=s.docs.map(d=>({id:d.id,...d.data()}));ok(c)},()=>ok(c)));
 db.doc("cfg/clinic").onSnapshot(s=>{S.cfg=s.exists?s.data():{name:"Chicco Clinic"};ok("cfg")},()=>ok("cfg"));
 document.addEventListener("click",()=>{try{window.Notification&&Notification.permission==="default"&&Notification.requestPermission()}catch(e){}},{once:true})})();
