<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chicco Clinic</title>
<style>
:root{--c:#1e6fd9;--bg:#f2f7ff;--card:#fff;--tx:#12263f;--mu:#5d6f86;--bd:#d8e4f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1726;--card:#17243a;--tx:#e8f0fc;--mu:#9bb0cc;--bd:#2a3c58}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:16px system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
.w{max-width:560px;margin:auto;padding:12px}
.top{background:var(--c);color:#fff;padding:12px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top img{width:36px;height:36px;border-radius:8px;object-fit:cover;background:#fff}.top b{flex:1;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
h3{margin:4px 0 10px}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)}
button{background:var(--c);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;width:100%;margin-top:10px;cursor:pointer}
button.o{background:transparent;color:var(--c);border:1.5px solid var(--c)}button.r{background:#d33}button.g{background:#178a4c}button.s{width:auto;padding:8px 12px;margin:0}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1;text-align:center;padding:12px 4px;font-size:13px;color:var(--mu)}.nav a.on{color:var(--c);font-weight:700}
.bd{font-size:12px;padding:3px 8px;border-radius:20px;background:#ffe9b8;color:#7a5200}.bd.ok{background:#c9f0d8;color:#0c6b36}.bd.no{background:#fbd0d0;color:#9a1b1b}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st{text-align:center}.st b{font-size:24px;color:var(--c);display:block}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}.row span:first-child{color:var(--mu)}
.t{padding:10px;border:2px solid var(--bd);border-radius:12px;display:flex;gap:10px;align-items:center;margin:6px 0;cursor:pointer}.t.on{border-color:var(--c);background:var(--bg)}.t img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.ban{width:100%;height:130px;object-fit:cover;border-radius:14px}.toast{position:fixed;top:70px;left:10px;right:10px;background:#12263f;color:#fff;padding:14px;border-radius:12px;z-index:9;font-weight:600}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--bd)}.sm{font-size:13px;color:var(--mu)}a{color:var(--c);text-decoration:none}
</style></head><body><div id="app"><div class="w">Inapakia…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app1.js?v=3"></script>
<script src="app2.js?v=3"></script>
</body></html>
